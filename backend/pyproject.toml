[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "repository-copilot"
version = "0.1.0"
description = "Evidence-backed repository understanding"
requires-python = ">=3.12,<3.15"
dependencies = [
  "alembic>=1.14,<2",
  "pydantic-settings>=2.7,<3",
  "psycopg[binary]>=3.2,<4",
  "sqlalchemy>=2.0,<3",
]

[project.scripts]
repo-copilot = "app.cli:main"
repo-copilot-eval = "app.evaluation.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["fixtures"]
